name: Deploy Frontend

on:
  pull_request:
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/deploy-frontend.yaml'
  push:
    branches: [ main ]
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/deploy-frontend.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dev
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  APP_DIR: portfolio-site
  DIST_DIR: portfolio-site/dist

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: ${{ env.DIST_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: dev
      url: ${{ vars.WEBSITE_URL }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: ${{ env.DIST_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets to S3
        run: |
          aws s3 sync "${DIST_DIR}" "s3://${{ vars.S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Set immutable cache policy for hashed assets
        run: |
          aws s3 cp "${DIST_DIR}" "s3://${{ vars.S3_BUCKET_NAME }}" \
            --recursive \
            --exclude "*" \
            --include "assets/styles.*.css" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css"

      - name: Set HTML cache policy
        run: |
          aws s3 cp "${DIST_DIR}" "s3://${{ vars.S3_BUCKET_NAME }}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
