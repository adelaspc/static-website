name: Deploy Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [ main ]
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/deploy-frontend.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dev
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  APP_DIR: portfolio-site
  DIST_DIR: portfolio-site/dist

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Audit dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: npm run ci

      - name: Upload frontend artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-dist
          path: ${{ env.DIST_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: dev
      url: ${{ vars.WEBSITE_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: frontend-dist
          path: ${{ env.DIST_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets to S3
        run: |
          aws s3 sync "${DIST_DIR}" "s3://${S3_BUCKET_NAME}" \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Set immutable cache policy for hashed assets
        run: |
          aws s3 cp "${DIST_DIR}" "s3://${S3_BUCKET_NAME}" \
            --recursive \
            --exclude "*" \
            --include "assets/styles.*.css" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css"

      - name: Set immutable cache policy for JavaScript
        run: |
          aws s3 cp "${DIST_DIR}" "s3://${S3_BUCKET_NAME}" \
            --recursive \
            --exclude "*" \
            --include "assets/site.*.js" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/javascript"

      - name: Set HTML cache policy
        run: |
          aws s3 cp "${DIST_DIR}" "s3://${S3_BUCKET_NAME}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.WEBSITE_URL != ''
    permissions: {}
    env:
      WEBSITE_URL: ${{ vars.WEBSITE_URL }}

    steps:
      - name: Check homepage
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 \
            --output /dev/null "${WEBSITE_URL}/"

      - name: Check missing-page behavior
        run: |
          status=$(curl --silent --show-error --location \
            --output /tmp/missing-page.html --write-out '%{http_code}' \
            "${WEBSITE_URL}/definitely-missing-page")
          test "$status" = "404"
          grep -Eq 'resource_not_found|404' /tmp/missing-page.html

      - name: Check security headers
        run: |
          headers=$(curl --fail --silent --show-error --location --dump-header - --output /dev/null "${WEBSITE_URL}/")
          printf '%s\n' "$headers" | grep -iq '^strict-transport-security:'
          printf '%s\n' "$headers" | grep -iq '^x-content-type-options:'
          printf '%s\n' "$headers" | grep -iq '^x-frame-options:'
